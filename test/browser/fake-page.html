<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Two Sum - LeetCode</title>
<style>
  /* Rough stand-in for LeetCode's problem layout, with hostile-ish global CSS
     so the prompt's style isolation gets exercised. */
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { font: 14px/1.5 -apple-system, "Segoe UI", sans-serif; background: #f0f0f0; color: #262626; }
  button { all: unset; } /* pages do this; the prompt must still look right */
  div { font-size: 20px; color: red; } /* deliberately leaky; content panels override */
  header { height: 48px; display: flex; align-items: center; justify-content: center; gap: 8px; background: #fff; border-bottom: 1px solid #e5e5e5; }
  header .btn { padding: 6px 14px; border-radius: 8px; background: #f2f2f2; font-weight: 600; cursor: pointer; font-size: 14px; color: #262626; }
  header .submit { background: #e7f6ec; color: #2db55d; }
  main { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 8px; height: calc(100% - 48px); }
  .panel { background: #fff; border-radius: 8px; padding: 16px 20px; font-size: 14px; color: #262626; overflow: hidden; }
  .panel h1 { font-size: 22px; margin: 0 0 8px; }
  .tag { display: inline-block; font-size: 12px; color: #00af9b; background: #f0f0f0; border-radius: 999px; padding: 2px 8px; }
  textarea { width: 100%; height: 55%; font: 13px/1.5 ui-monospace, monospace; border: 1px solid #eee; border-radius: 6px; padding: 8px; }
  .result { margin-top: 12px; font-size: 18px; font-weight: 600; color: #2db55d; }
  @media (prefers-color-scheme: dark) {
    body { background: #0f0f0f; color: #eff1f6; }
    header, .panel { background: #1a1a1a; border-color: #2a2a2a; color: #eff1f6; }
    header .btn { background: #2a2a2a; color: #eff1f6; }
    header .submit { background: #1f3326; color: #2cbb5d; }
    textarea { background: #1e1e1e; color: #ddd; border-color: #333; }
  }
</style>
</head>
<body>
  <header>
    <span class="btn" role="button">Run</span>
    <button class="btn submit" data-e2e-locator="console-submit-button"><span>Submit</span></button>
  </header>
  <main>
    <section class="panel">
      <h1>1. Two Sum</h1>
      <span class="tag">Easy</span>
      <p>Given an array of integers <code>nums</code> and an integer <code>target</code>, return indices of the two numbers such that they add up to <code>target</code>.</p>
      <p>You may assume that each input would have exactly one solution, and you may not use the same element twice.</p>
    </section>
    <section class="panel">
      <textarea id="editor" spellcheck="false">class Solution:
    def twoSum(self, nums, target):
        seen = {}
        for i, n in enumerate(nums):
            if target - n in seen:
                return [seen[target - n], i]
            seen[n] = i</textarea>
      <div class="panel" id="result-area"></div>
    </section>
  </main>
</body>
</html>
